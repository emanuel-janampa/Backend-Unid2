spring.application.name=ecorecicla-api
server.port=${SERVER_PORT:8080}

# PostgreSQL. For local use, defaults point at docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecorecicla}
spring.datasource.username=${DB_USER:ecorecicla}
spring.datasource.password=${DB_PASSWORD:ecorecicla_dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Dev convenience. For production, use Flyway/Liquibase and set ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Use a long private value from APP_JWT_SECRET in deployed environments.
app.jwt.secret=${APP_JWT_SECRET:EcoRecicla-local-only-secret-change-this-before-deployment-2026-01}
app.jwt.issuer=${APP_JWT_ISSUER:ecorecicla-api}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}

# Seed only on an empty database. Demo credentials are documented in README.md.
app.seed.enabled=${SEED_ENABLED:true}
