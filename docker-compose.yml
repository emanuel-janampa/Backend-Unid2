services:
  postgres:
    image: postgres:16-alpine
    container_name: ecorecicla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecorecicla
      POSTGRES_USER: ecorecicla
      POSTGRES_PASSWORD: ecorecicla_dev
    ports:
      - "5432:5432"
    volumes:
      - ecorecicla_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecorecicla -d ecorecicla"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: .
    container_name: ecorecicla-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      TZ: America/Lima
      DB_URL: jdbc:postgresql://postgres:5432/ecorecicla
      DB_USER: ecorecicla
      DB_PASSWORD: ecorecicla_dev
      APP_JWT_SECRET: ${APP_JWT_SECRET:-EcoRecicla-local-only-secret-change-this-before-deployment-2026-01}
      APP_JWT_ISSUER: ecorecicla-api
      APP_JWT_EXPIRATION_MINUTES: 60
      DDL_AUTO: update
      SEED_ENABLED: true
    ports:
      - "8080:8080"

volumes:
  ecorecicla_postgres_data:
